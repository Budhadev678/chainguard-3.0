services:
- type: web
  name: chainguard-api
  runtime: python
  region: oregon
  buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
  rootDir: backend
  envVars:
    - key: GEMINI_API_KEY
        sync: false
    - key: PYTHON_VERSION
        value: 3.11.0

- type: static
  name: chainguard-app
  buildCommand: npm install && npm run build
    staticPublishPath: dist
  rootDir: frontend
  routes:
    - type: rewrite
      source: /*
      destination: /index.html      
